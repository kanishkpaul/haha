[project]
name = "career-tailor"
version = "0.1.0"
description = "Tailor Kanishk Paul's resume to a job from the master career record, with Resume-Matcher as the ATS checker."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pdfminer.six>=20240706",
    "ortools>=9.11",
    "rendercv[full]>=2.0",
    "python-docx>=1.1",
]

[project.scripts]
tailor = "career_tailor.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: needs the real career record or Resume-Matcher; skipped when absent"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word lists written as one string read better

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures and expected strings read better unwrapped
